name: Build and Deploy on PR Merge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:latest
            ${{ vars.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deploy webhook with JWT
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
          FOLDER_NAME: ${{ vars.FOLDER_NAME }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          curl --fail -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEPLOY_HOOK_TOKEN" \
            -d "{\"folder\":\"${FOLDER_NAME}\",\"service\":\"${SERVICE_NAME}\",\"image\":\"${IMAGE_NAME}:${SHORT_SHA}\"}"
